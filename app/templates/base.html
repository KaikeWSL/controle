<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema de Gerenciamento de Nodes{% endblock %}</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- DataTables CSS -->
    <link href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        .navbar-brand {
            font-weight: bold;
        }
        .status-badge {
            font-size: 0.85em;
            padding: 0.375rem 0.75rem;
        }
        .status-ativo { background-color: #28a745; }
        .status-em-andamento { background-color: #fd7e14; }
        .status-concluido { background-color: #6c757d; }
        .progress-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .card-stats {
            border-left: 4px solid;
            transition: transform 0.2s;
        }
        .card-stats:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .device-id-display {
            background-color: #f8f9fa;
            border: 2px dashed #dee2e6;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            font-family: 'Courier New', monospace;
            font-size: 1.2em;
            font-weight: bold;
            color: #495057;
        }
    </style>
    
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-sitemap me-2"></i>
                Sistema de Nodes
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">
                            <i class="fas fa-home me-1"></i>Início
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/nodes">
                            <i class="fas fa-list me-1"></i>Meus Nodes
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/available">
                            <i class="fas fa-play-circle me-1"></i>Disponíveis
                        </a>
                    </li>
                </ul>
                
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/admin">
                            <i class="fas fa-cog me-1"></i>Admin
                        </a>
                    </li>
                    <li class="nav-item">
                        <span class="nav-link text-light" id="user-info">
                            <i class="fas fa-user me-1"></i>
                            <span id="user-name">Carregando...</span>
                        </span>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mt-4">
        <!-- Alerts -->
        <div id="alerts-container"></div>
        
        {% block content %}{% endblock %}
    </div>

    <!-- Footer -->
    <footer class="bg-light text-center text-muted py-3 mt-5">
        <div class="container">
            <small>&copy; 2024 Sistema de Gerenciamento de Nodes. Todos os direitos reservados.</small>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>
    
    <script>
        // Função para exibir alertas
        function showAlert(message, type = 'info') {
            const alertHtml = `
                <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `;
            $('#alerts-container').append(alertHtml);
            
            // Remove automaticamente após 5 segundos
            setTimeout(() => {
                $('.alert').fadeOut();
            }, 5000);
        }
        
        // Função para verificar autorização
        async function checkAuthorization() {
            try {
                const response = await fetch('/api/auth/check-device', {
                    method: 'POST'
                });
                const data = await response.json();
                
                if (data.authorized) {
                    $('#user-name').text(data.user_name);
                    return true;
                } else {
                    showAlert(data.message, 'warning');
                    $('#user-name').text('Não autorizado');
                    return false;
                }
            } catch (error) {
                showAlert('Erro ao verificar autorização', 'danger');
                return false;
            }
        }
        
        // Verificar autorização ao carregar a página
        $(document).ready(function() {
            checkAuthorization();
        });
        
        // Função para fazer requisições autenticadas
        async function authenticatedFetch(url, options = {}) {
            const response = await fetch(url, {
                ...options,
                headers: {
                    'Content-Type': 'application/json',
                    ...options.headers
                }
            });
            
            if (response.status === 401) {
                showAlert('Sessão expirada. Verifique sua autorização.', 'danger');
                checkAuthorization();
                throw new Error('Não autorizado');
            }
            
            return response;
        }
    </script>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
